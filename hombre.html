<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumes para Hombre - Catálogo Digital</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>💎 PERFUMES PARA HOMBRE</h1>
        <nav class="menu">
            <a href="./index.html">🏠 INICIO</a>
            <a href="./hombre.html" style="background: #3498db;">👨 HOMBRE</a>
            <a href="./mujer.html">👩 MUJER</a>
            <button onclick="contactar('Consulta General')">💬 WHATSAPP</button>
        </nav>
    </header>

    <main>
        <h1 class="titulo-pagina">COLECCIÓN EXCLUSIVA PARA HOMBRE</h1>

        <!-- FORMULARIO -->
        <div class="formulario-contacto">
            <h3>📝 TUS DATOS (OPCIONAL)</h3>
            <div class="input-group">
                <label>👤 Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </div>
            <div class="input-group">
                <label>📱 WhatsApp</label>
                <input type="tel" id="telefono" placeholder="Tu número">
            </div>
            <button onclick="contactar('Catálogo Hombre')" class="btn-whatsapp">
                💬 CONTACTAR AHORA
            </button>
        </div>

        <!-- CATÁLOGO -->
        <div id="catalogo-hombre">
            <!-- Se carga automáticamente -->
        </div>
    </main>

    <footer>
        <h3>📞 CONTACTO DIRECTO</h3>
        <p style="font-size: 1.2rem; margin: 20px 0;">
            <strong>WhatsApp: +57 300 395 3447</strong>
        </p>
        <button onclick="contactar('Consulta desde footer')" class="whatsapp-footer">
            💬 PREGUNTAR AHORA
        </button>
    </footer>

    <script src="./whatsapp.js"></script>
    <script src="./catalogo.js"></script>
</body>
</html>
