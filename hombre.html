<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumes para Hombre - Catálogo Digital</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>💎 CATÁLOGO DE PERFUMES</h1>
        <nav class="menu">
            <a href="index.html" class="menu-inicio">🏠 INICIO</a>
            <a href="hombre.html" class="menu-hombre">👨 HOMBRE</a>
            <a href="mujer.html" class="menu-mujer">👩 MUJER</a>
            <a href="javascript:void(0);" onclick="contactar('Consulta General')" class="menu-whatsapp">💬 WHATSAPP</a>
        </nav>
    </header>

    <main>
        <h1 class="titulo-pagina">PERFUMES EXCLUSIVOS PARA HOMBRE</h1>
        
        <!-- BOTÓN DE PRUEBA -->
        <button onclick="probarWhatsApp()" class="btn-prueba">
            🔥 PROBAR WHATSAPP AHORA
        </button>

        <!-- FORMULARIO -->
        <div class="formulario-contacto">
            <h3>📝 COMPLETA TUS DATOS</h3>
            <div class="input-group">
                <label for="nombre">👤 Tu Nombre</label>
                <input type="text" id="nombre" placeholder="Ej: Carlos Pérez" required>
            </div>
            <div class="input-group">
                <label for="telefono">📱 Tu WhatsApp</label>
                <input type="tel" id="telefono" placeholder="Ej: 3001234567" required>
            </div>
            <button onclick="contactar('Catálogo completo Hombre')" class="btn-whatsapp">
                💬 CONTACTAR POR WHATSAPP
            </button>
        </div>

        <!-- CATÁLOGO -->
        <div class="catalogo-container">
            <h2 style="text-align: center; color: #2c3e50; margin-bottom: 20px;">
                🛍️ COLECCIÓN EXCLUSIVA PARA HOMBRE CLASICAS Y ARABES 
            </h2>
            
            <!-- AQUÍ SE CARGARÁ EL CATÁLOGO -->
            <div id="catalogo-hombre">
                <!-- El JavaScript cargará los productos aquí -->
            </div>
            
            <!-- BOTÓN DE RECARGA -->
            <div style="text-align: center; margin-top: 40px;">
                <button onclick="cargarCatalogo('hombre')" 
                        style="background: #3498db; color: white; border: none; padding: 12px 25px; 
                               border-radius: 8px; cursor: pointer; font-size: 1rem;">
                    🔄 RECARGAR CATÁLOGO
                </button>
            </div>
        </div>
    </main>

    <footer>
        <h3>📞 CONTACTO DIRECTO</h3>
        <p style="font-size: 1.2rem; margin: 20px 0;">
            <strong>WhatsApp: +57 300 881 3801</strong>
        </p>
        <button onclick="contactar('Consulta desde el footer')" class="whatsapp-footer">
            💬 ESCRIBIR POR WHATSAPP
        </button>
        <p style="margin-top: 20px; color: #bdc3c7;">
            © 2026 - Catálogo Digital - Todos los derechos reservados
        </p>
    </footer>

    <!-- SCRIPTS -->
    <script src="whatsapp.js"></script>
    <script src="catalogo.js"></script>
    
    <!-- VERIFICACIÓN -->
    <script>
        console.log("✅ Página hombre.html cargada");
        console.log("🔍 Verificando funciones:");
        console.log("- contactar:", typeof contactar);
        console.log("- cargarCatalogo:", typeof cargarCatalogo);
        console.log("- probarWhatsApp:", typeof probarWhatsApp);
    </script>
</body>
</html>
